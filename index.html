function scheduleMinutes(s,n){return new Date(Date.parse(s+'Z')+n*60000).toISOString().slice(0,16)}

function jobReadiness(r){if(r.status==='Completed')return {ready:true,label:'Completed',missing:[]};const missing=[];if(unresolvedAddress(r.address))missing.push('location');if(r.confirmation!=='Confirmed')missing.push('customer confirmation');if(ownerBlocked(r))missing.push('schedule clash');if(r.type==='Van Hire'){const h=extras('hire').find(h=>h.bookingId===r.id)||{};if(!h.licenceUrl)missing.push('licence photo');if(!(h.deposit>0))missing.push('security deposit');if(!(h.mileageOut>0)||!h.fuelOut||h.fuelOut==='Not recorded')missing.push('mileage / fuel');if(!h.beforeUrl)missing.push('condition photos')}else if(r.type!=='Callback'){const items=bringItems(r),packed=packingFor(r.start.slice(0,10));if(items.length&&items.some(x=>!packed.includes(packingKey(x))))missing.push('tools / materials packed')}return {ready:!missing.length,label:missing.length?'Check '+missing.length+' item'+(missing.length===1?'':'s'):'Ready to go',missing}}

.id+'\')">Open job</button></p>':'')+'</div><div class="conversationActions"><button class="gold" onclick="threadQuote(\''+c.id+'\')">Prepare quote</button><button onclick="offerThreadTimes(\''+c.id+'\')">Offer times</button><button onclick="bookThread(\''+c.id+'\')">Book it</button><button onclick="crewThread(\''+c.id+'\')">Pass to crew</button><button onclick="prepareThreadMessage(\''+c.id+'\',\'decline\')">Not for me</button></div><div class="conversationFooter"><button onclick="prepareThreadMessage(\''+c.id+'\',\'reply\')">Write reply</button><button class="quietAction" onclick="setThreadState(\''+c.id+'\',\'Done\')">Archive conversation</button></div>'}

async function saveThread(c){const {linkedBooking,quote,preview,defaultState,waitFrom,...record}=c;record.messages=record.messages||[];record.state=record.state||defaultState||'Needs me';await saveExtra('conversation',record)}

function recordMessage(id){show('<div class="dialoghead"><h2>Record customer reply</h2><button onclick="close()">×</button></div><form onsubmit="saveIncoming(event,\''+id+'\')">'+selectField('kind','Message type',['Text','Photo','Voice note transcript'],'Text')+'<label for="messageText">Message / typed transcript</label><textarea id="messageText" name="text" maxlength="8000" required></textarea>'+field('url','Photo / voice-note link (HTTPS, optional)','','url')+'<p>Original WhatsApp messages are not imported. This is a manual record.</p><p id="formerror" class="error"></p><div class="actions"><button class="gold">Save reply</button></div></form>')}
async function saveIncoming(e,id){e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target)),c=threadById(id),at=new Date().toISOString();if(f.url&&!/^https:\/\//i.test(f.url))throw Error('Use a secure HTTPS link.');await saveThread({...c,state:'Needs me',needsSince:at,messages:[...(c.messages||[]),{direction:'incoming',kind:f.kind==='Photo'?'photo':f.kind==='Voice note transcript'?'voice':'text',text:f.text.trim(),url:f.url||'',at}]});close();inboxTab='Needs me';selectedConversation=id;render()}catch(err){el('formerror').textContent=err.message}}
function editThreadDetails(id){const c=threadById(id);show('<div class="dialoghead"><h2>Enquiry details</h2><button onclick="close()">×</button></div><form onsubmit="saveThreadDetails(event,\''+id+'\')"><div class="formgrid">'+field('name','Customer name',c.name,'text','required maxlength="100"')+field('phone','Customer phone',c.phone,'tel','maxlength="50"')+field('title','What needs doing',c.title,'text','required maxlength="300"')+field('address','Address / postcode',c.address,'text','maxlength="300"')+field('start','Date / time wanted',c.start,'datetime-local')+field('duration','Your duration estimate (hours)',c.duration||1,'number','min="0.25" max="336" step="0.25" required')+'<div><label for="threadService">Price template</label><select id="threadService" name="serviceId"><option value="">Choose service…</option>'+list('services').map(s=>'<option value="'+s.id+'" '+(s.id===c.serviceId?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div>'+field('quantity','Items / rooms / loads / hours / days',c.quantity||1,'number','min="0.25" max="10000" step="0.25" required')+field('floors','Floors / flights',c.floors||0,'number','min="0" max="100"')+field('distance','Chargeable miles',c.distance||0,'number','min="0" max="10000"')+selectField('source','How they got in touch',['Pasted message / note','WhatsApp · manually recorded','Phone / callback request','Missed call · manually recorded','Manual / web request','Referral'],c.source||'Pasted message / note')+'</div><p id="formerror" class="error"></p><div class="actions"><button class="gold">Save details</button></div></form>')}

function prepareThreadMessage(id,kind='reply',text=''){const c=threadById(id);show('<div class="dialoghead"><h2>'+(kind==='decline'?'Polite decline':'Prepare reply')+'</h2><button onclick="close()">×</button></div><form onsubmit="recordSentThread(event,\''+id+'\',\''+(kind==='decline'?'Done':'Waiting on customer')+'\')"><textarea id="followText" name="text" maxlength="8000" required>'+esc(text||threadText(c,kind))+'</textarea><p>Nothing has been sent. Copy or open WhatsApp, send it yourself, then record it below.</p><div class="actions"><button type="button" onclick="copyDraft()">Copy message</button>'+(c.phone?'<a class="actionLink" target="_blank" rel="noopener" href="https://wa.me/'+c.phone.replace(/\D/g,'').replace(/^0/,'44')+'?text='+encodeURIComponent(text||threadText(c,kind))+'">Open WhatsApp</a>':'<button type="button" onclick="editThreadDetails(\''+id+'\')">Add phone</button>')+'<button class="gold">I sent it · '+(kind==='decline'?'close conversation':'waiting for reply')+'</button></div><p id="formerror" class="error"></p></form>')}
async function recordSentThread(e,id,state){e.preventDefault();try{const text=new FormData(e.target).get('text').trim(),c=threadById(id);await saveThread({...c,state,messages:[...(c.messages||[]),{direction:'outgoing',kind:'text',text,at:new Date().toISOString()}]});close();conversationOnPhone=false;render()}catch(err){el('formerror').textContent=err.message}}
function candidateSlots(c){const s=list('services').find(s=>s.id===c.serviceId),resources=s?.resources||(s?.category==='Van Hire'?'Van':c.linkedBooking?resourceLabel(c.linkedBooking):'Owner'),hours=Number(c.duration|| (resources==='Van'?24:1)),duration=hours*60,bs=demo?sample:data,slots=[];if(extras('hire').some(h=>h.status==='Out'&&find(h.bookingId)?.end<localNow())&&resources!=='Owner')return [];for(let day=0;day<14&&slots.length<3;day++)for(let min=420;min<=1260&&slots.length<3;min+=30){const start=moveDay(today(),day)+'T'+String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'),end=clientAddMinutes(start,duration),r={id:c.bookingId||'',type:s?.category==='Van Hire'?'Van Hire':'Maintenance',resources,start,end,status:'Confirmed'};if(start<=localNow()||resources!=='Van'&&(end.slice(0,10)!==start.slice(0,10)||end.slice(11,16)>'22:00')||ownerBlocked(r))continue;const buffer=Number(settings.travelBuffer||0),hit=bs.some(b=>b.id!==c.bookingId&&b.status==='Confirmed'&&((resources!=='Van'&&resourceLabel(b)!=='Van'&&b.start<clientAddMinutes(end,buffer)&&b.end>clientAddMinutes(start,-buffer))||(resources!=='Owner'&&resourceLabel(b)!=='Owner'&&b.start<end&&b.end>start)));if(!hit)slots.push({start,end,resources})}return slots}
function offerThreadTimes(id){const c=threadById(id),slots=candidateSlots(c);show('<div class="dialoghead"><h2>Offer available times</h2><button onclick="close()">×</button></div><p>Using your '+Number(c.duration||1)+' hour estimate and saved shifts / resources. Slots are not reserved until the booking is saved.</p>'+slots.map(s=>'<button class="slotOffer" onclick="chooseThreadSlot(\''+id+'\',\''+s.start+'\',\''+s.end+'\')">'+datetime(s.start)+' · '+esc(s.resources.replace('Owner',settings.owner||'Me'))+'</button>').join('')+(!slots.length?'<p>No matching slots found over the next 14 days. Check your duration, shifts and van returns.</p>':'')+'<button onclick="editThreadDetails(\''+id+'\')">Edit duration / service</button>')}
async function chooseThreadSlot(id,start,end){try{await saveThread({...threadById(id),start,end});prepareThreadMessage(id,'reply','Hi '+threadById(id).name+', would '+datetime(start)+' work for '+threadById(id).title+'? Please confirm. Thanks, '+settings.business)}catch(e){toast(e.message)}}
function threadQuote(id){const c=threadById(id);if(c.quoteId){quoteEdit(c.quoteId);quoteConversation=id;return}quoteEdit();quoteConversation=id;const s=list('services').find(s=>s.id===c.serviceId);for(const [k,v]of Object.entries({name:c.name,phone:c.phone,service:c.title,amount:s?cataloguePrice(s,Number(c.quantity||1),Number(c.floors||0),Number(c.distance||0)):c.linkedBooking?.price||0,notes:(c.text||'').slice(0,3000),quoteService:c.serviceId||'',quoteQuantity:c.quantity||1,quoteFloors:c.floors||0,quoteDistance:c.distance||0}))if(el(k))el(k).value=v;if(c.sourceKind==='booking'&&c.linkedBooking?.status==='Pending')pendingEnquiryId=c.sourceId;el('modal').insertAdjacentHTML('beforeend','<p>Prepare the quote here. Mark Sent only after you have sent it yourself.</p>')}

const recordInbox=saveRecord;saveRecord=async function(kind,r){if(kind==='quote'&&quoteConversation)r.conversationId=quoteConversation;await recordInbox(kind,r);if(kind==='quote'&&r.conversationId){const c=threadById(r.conversationId);if(c){await saveThread({...c,quoteId:r.id,state:['Sent','Accepted'].includes(r.status)?'Waiting on customer':r.status==='Declined'?'Done':'Needs me'});quoteConversation=''}}};
function bookThread(id){const c=threadById(id);if(c.quoteId&&c.quote?.status==='Accepted'){quoteToBooking(c.quoteId);if(el('address'))el('address').value=c.address;for(const k of ['start','end'])if(el(k))el(k).value=c[k]||'';el('status').value='Confirmed';return}if(c.quoteId&&c.quote?.status==='Sent'){toast('Record the customer’s acceptance in the quote before booking.');quoteEdit(c.quoteId);return}if(c.sourceKind==='draft'){reviewDraft(c.sourceId);for(const [k,v]of Object.entries({name:c.name,phone:c.phone,title:c.title,address:c.address,start:c.start,end:c.end,status:'Confirmed',serviceId:c.serviceId||'',quantity:c.quantity||1}))if(el(k))el(k).value=v;updateCataloguePrice()}else{edit(c.sourceId);for(const [k,v]of Object.entries({name:c.name,phone:c.phone,title:c.title,address:c.address,start:c.start,end:c.end,status:'Confirmed',serviceId:c.serviceId||'',quantity:c.quantity||1}))if(el(k))el(k).value=v;updateCataloguePrice()}el('modal').querySelector('form').dataset.conversationId=id}
const persistInbox=persist;persist=async function(r){await persistInbox(r);if(r.status==='Confirmed'||r.status==='Completed'||r.status==='Declined'){const c=conversationList().find(c=>c.bookingId===r.id||c.sourceKind==='booking'&&c.sourceId===r.id||r.draftId&&c.sourceId===r.draftId||r.quoteId&&c.quoteId===r.quoteId);if(c)await saveThread({...c,bookingId:r.id,state:'Done'})}};
function crewThread(id){const c=threadById(id);if(c.bookingId&&find(c.bookingId)){passJobToCrew(c.bookingId);el('modal').querySelector('form').dataset.conversationId=id;return}crewEdit();for(const [k,v]of Object.entries({work:c.title,area:c.address.match(/\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b/i)?.[0]||settings.area||'',notes:'Enquiry from '+c.name+'. Record agreement manually; customer details are not sent.'}))if(el(k))el(k).value=v;el('modal').querySelector('form').dataset.conversationId=id;el('modal').insertAdjacentHTML('afterbegin','<p class="crewOfferNote">Manual crew offer. Nothing is sent. Book / link the job once agreed.</p>')}

const viewInbox=todayView;todayView=function(){let html=viewInbox();const slow=conversationList().filter(c=>c.state==='Needs me'&&c.waitFrom&&Date.now()-Date.parse(c.waitFrom)>4*3600000),warning=slow.map(c=>'<div class="warningRow"><span>'+esc(c.name)+' waiting '+esc(waitAge(c.waitFrom))+'</span><button onclick="openConversation(\''+c.id+'\')">Reply now</button></div>').join('');if(warning){if(html.includes('Actions requiring review</strong>'))html=html.replace('Actions requiring review</strong>','Actions requiring review</strong>'+warning);else html=html.replace('<div class="todayPriority">','<div class="warningStrip" role="alert"><strong>'+alarmIcon+'Awaiting response</strong>'+warning+'</div><div class="todayPriority">')}html=html.replace('<h2>Awaiting response</h2>','<h2>Awaiting response</h2>').replace('<div class="waitingRow waitingCompact"','<div class="todayWhatsapp"><span>WhatsApp not connected</span><button onclick="go(\'WhatsApp & Connections\')">Connect</button></div><div class="waitingRow waitingCompact"');return html};

function updateComposerLabel(direction){el('composerSubmit').textContent=direction==='incoming'?'Save customer message':direction==='note'?'Save private note':'Record as sent'}

async function saveChatComposer(e,id){e.preventDefault();const button=e.target.querySelector('button.composerSubmit');if(button?.disabled)return;if(button)button.disabled=true;try{const f=Object.fromEntries(new FormData(e.target)),c=threadById(id),text=f.text.trim(),at=new Date().toISOString(),url=f.chatUrl||'',direction=f.direction;if(!text)throw Error('Enter a message or note.');if(url&&!/^https:\/\//i.test(url))throw Error('Use a secure HTTPS attachment link.');const state=direction==='incoming'?'Needs me':direction==='outgoing'?'Waiting on customer':c.state;await saveThread({...c,state,needsSince:direction==='incoming'?at:c.needsSince,messages:[...(c.messages||[]),{direction,kind:f.chatKind==='Photo'?'photo':f.chatKind==='Voice note transcript'?'voice':'text',text,url,at}]});inboxTab=state;selectedConversation=id;render()}catch(err){el('chaterror').textContent=err.message}finally{if(button)button.disabled=false}}
function checklistRow(c,label,value,kind){const good=!!value;return '<div class="jobChecklistRow"><span class="'+(good?'checkGood':'checkMissing')+'" aria-hidden="true">'+(good?'✓':'✗')+'</span><span><b>'+label+'</b> '+esc(value||'Missing')+'</span>'+(!good?'<button onclick="askChatDetail(\''+c.id+'\',\''+kind+'\')">Ask</button>':'')+'</div>'}
function askChatDetail(id,kind){const c=threadById(id);el('chatText').value=kind==='phone'?'Hi '+c.name+', what number can I reach you on? Thanks, '+settings.business:threadText(c,kind);el('chatDirection').value='outgoing';updateComposerLabel('outgoing');el('chatText').focus?.()}
function cardPrice(c){const s=list('services').find(s=>s.id===c.serviceId);return c.priceOverride!==undefined?Number(c.priceOverride):s?cataloguePrice(s,Number(c.quantity||1),Number(c.floors||0),Number(c.distance||0)):Number(c.quote?.amount||c.linkedBooking?.price||0)}
function inlineJobCard(c){return '<aside class="inlineJobCard">'+typeBadge(c.linkedBooking||c)+'<h3>Job card</h3>'+checklistRow(c,'What:',c.title,'job')+checklistRow(c,'When:',c.start?datetime(c.start):'','date')+checklistRow(c,'Where:',unresolvedAddress(c.address)?'':c.address,'postcode')+checklistRow(c,'Phone:',c.phone,'phone')+'<button class="quietAction" onclick="editThreadDetails(\''+c.id+'\')">Edit details</button><form id="inlinePrice" class="inlinePrice" onsubmit="saveInlinePrice(event,\''+c.id+'\')"><label for="inlineService">Service & pricing</label><select id="inlineService" name="serviceId" onchange="calculateInlinePrice()"><option value="">Custom price</option>'+list('services').map(s=>'<option value="'+s.id+'" '+(s.id===c.serviceId?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><div class="inlinePriceNumbers">'+field('inlineQuantity','Quantity',c.quantity||1,'number','min="0.25" max="10000" step="0.25" required oninput="calculateInlinePrice()"')+field('inlineAmount','Price (£)',cardPrice(c),'number','min="0" max="10000000" step="0.01" required')+'</div><small id="inlinePriceHint">'+(c.serviceId?'Uses your saved template; price can be edited.':'Enter your agreed price or select a service.')+'</small><button class="quietAction">Save price</button><p id="priceerror" class="error"></p></form><div class="jobCardActions">'+primaryChatAction(c)+'<div class="secondaryChatActions"><button onclick="offerThreadTimes(\''+c.id+'\')">Offer times</button><button onclick="bookFromChat(\''+c.id+'\')">Book it</button><details class="threadMore"><summary>More ▾</summary><div><button onclick="crewThread(\''+c.id+'\')">Pass to crew</button><button onclick="prepareThreadMessage(\''+c.id+'\',\'decline\')">Not for me</button><button onclick="setThreadState(\''+c.id+'\',\'Done\')">Archive</button></div></details></div></div>'+(c.linkedBooking&&c.linkedBooking.status!=='Pending'?'<button onclick="detail(\''+c.linkedBooking.id+'\')">Open linked job</button>':'')+'</aside>'}
function primaryChatAction(c){if(c.state==='Done')return '<button class="gold primaryChatAction" onclick="editThreadDetails(\''+c.id+'\')">Review job details</button>';if(c.state==='Waiting on customer')return '<button class="gold primaryChatAction" onclick="askChatDetail(\''+c.id+'\',\'reply\')">Nudge customer</button>';if(threadNeed(c)==='Call back'){const phone=String(c.phone||'').replace(/[^+0-9]/g,'');return phone?'<a class="actionLink gold primaryChatAction" href="tel:'+esc(phone)+'">Call now</a>':'<button class="gold primaryChatAction" onclick="editThreadDetails(\''+c.id+'\')">Add phone to call</button>'}if(jobDetailsMissing(c).length||unresolvedAddress(c.address)||!c.phone)return '<button class="gold primaryChatAction" onclick="askAllDetails(\''+c.id+'\')">Ask for missing details</button>';return '<button class="gold primaryChatAction" onclick="quoteFromChat(\''+c.id+'\')">Send quote</button>'}
function askAllDetails(id){const c=threadById(id),parts=[];if(!c.title)parts.push('what needs doing');if(unresolvedAddress(c.address))parts.push('the full address and postcode');if(!c.start)parts.push('your preferred date and time');if(!c.phone)parts.push('a contact phone number');el('chatText').value='Hi '+c.name+', could you send '+parts.join(', ')+'? Thanks, '+settings.business;el('chatDirection').value='outgoing';updateComposerLabel('outgoing');el('chatText').focus?.()}
function calculateInlinePrice(){const s=list('services').find(s=>s.id===el('inlineService').value),c=threadById(selectedConversation);if(s&&Number(el('inlineQuantity').value)>0){el('inlineAmount').value=cataloguePrice(s,Number(el('inlineQuantity').value),Number(c.floors||0),Number(c.distance||0));el('inlinePriceHint').textContent=s.model==='Quote required'?'Custom quote required. Enter the agreed price.':'Calculated from your saved price template.'}}
async function persistInlinePrice(id){const c=threadById(id),quantity=Number(el('inlineQuantity').value),priceOverride=Number(el('inlineAmount').value),serviceId=el('inlineService').value;if(!Number.isFinite(quantity)||quantity<=0||quantity>10000||!Number.isFinite(priceOverride)||priceOverride<0||priceOverride>10000000)throw Error('Check quantity and price.');await saveThread({...c,serviceId,quantity,priceOverride});return threadById(id)}
async function saveInlinePrice(e,id){e.preventDefault();try{await persistInlinePrice(id);render();toast('Price saved.')}catch(err){el('priceerror').textContent=err.message}}
async function quoteFromChat(id){try{await persistInlinePrice(id);threadQuote(id);el('amount').value=cardPrice(threadById(id));el('modal').insertAdjacentHTML('afterbegin','<p class="handoverPrompt">Review the quote. Send it yourself, then mark it Sent to move this conversation to Waiting on customer.</p>')}catch(err){el('priceerror').textContent=err.message}}
async function bookFromChat(id){try{await persistInlinePrice(id);bookThread(id);const c=threadById(id);if(el('price'))el('price').value=cardPrice(c)}catch(err){el('priceerror').textContent=err.message}}
conversationPanel=function(c){const repeat=customerJobCount(c),messages=c.messages||[];return '<div class="chatColumn"><div class="conversationHead"><button class="conversationBack" onclick="conversationOnPhone=false;render()">Back to inbox</button><div class="chatNameRow"><h2>'+esc(c.name)+'</h2>'+headerContacts(c)+'</div><p>'+(repeat>0?'Repeat customer · '+repeat+' job'+(repeat===1?'':'s'):'New customer')+' · '+sourceSymbol(c)+' '+esc(c.source||'Manual / unknown')+'</p></div><div class="messageHistory" role="log" aria-label="Conversation messages">'+(c.text?chatMessage({direction:'incoming',kind:'text',text:c.text,at:c.receivedAt}):'')+messages.map(chatMessage).join('')+'</div>'+chatComposer(c)+'</div>'+inlineJobCard(c)};
// One label across the app and a compact header for the working screen.
const renderChat=render;render=function(){renderChat();if(page==='Inbox'&&ready){const main=el('main');main.innerHTML=main.innerHTML.replace('Capture enquiry','Quick capture');}}


// A compact work board, backed by the existing quote, booking and payment records.
datetime=function(s){if(!s)return 'Date not recorded';const isDate=/^\d{4}-\d{2}-\d{2}$/.test(s);const wall=!isDate&&!/[Z+]/.test(s);const d=new Date(isDate?s+'T12:00Z':wall?s+'Z':s);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:wall?'UTC':'Europe/London'})+(isDate?'':', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:wall?'UTC':'Europe/London'}));};
let jobsMode='Board',jobsType='All',jobsWho='All',jobsVan=false;
const workStages=['Quoted','Booked','Done','Paid','Lost / Cancelled'];
const unifiedBeforeBoard=unifiedJobs;unifiedJobs=function(){return unifiedBeforeBoard().map(j=>({...j,stage:j.stage==='Closed'?'Lost / Cancelled':j.stage}));};
function workCrew(j){return extras('crew').find(c=>c.bookingId===j.booking?.id&&['Accepted','Completed'].includes(c.status));}
function workMeta(j){return extras('jobflow').find(m=>m.id==='flow_'+j.id)||{id:'flow_'+j.id,events:[],reason:'',paperwork:''};}
function quoteAge(j){return j.quote?.sent?Math.max(0,Math.floor((Date.parse(today()+'T12:00Z')-Date.parse(j.quote.sent+'T12:00Z'))/86400000)):null;}
function staleWork(j){return j.stage==='Quoted'&&j.quote?.status==='Sent'&&quoteAge(j)>=3;}
function overdueWork(j){return j.stage==='Booked'&&j.booking.status!=='Paused'&&j.booking.end<localNow();}
function workJobs(){return unifiedJobs().filter(j=>j.stage!=='Enquiry'&&[j.name,j.title].join(' ').toLowerCase().includes(query.toLowerCase())&&(jobsType==='All'||jobTheme(j.booking||j.quote).name===jobsType)&&(jobsWho==='All'||(jobsWho==='Crew')===!!workCrew(j))&&(!jobsVan||j.booking?.type==='Van Hire'||jobTheme(j.booking||j.quote).name==='Van hire'));}
function workEmpty(s){return {'Quoted':'No quotes waiting for an answer','Booked':'No jobs booked yet','Done':'Nothing finished yet','Paid':'No payments yet','Lost / Cancelled':'No lost or cancelled jobs'}[s];}
function workStats(s){const js=workJobs().filter(j=>j.stage===s);return {count:js.length,total:js.reduce((n,j)=>n+Number(j.amount||0),0)};}
function workStatusText(j){const r=j.booking;if(j.stage==='Quoted'){const a=quoteAge(j);return (j.quote?.status==='Accepted'?'Customer accepted':a===null?'Sent date not recorded':'Sent '+a+' day'+(a===1?'':'s')+' ago');}if(j.stage==='Booked')return datetime(r.start)+' · '+(r.confirmation==='Confirmed'?'✓ Customer confirmed':r.confirmation==='Awaiting reply'?'Reminder recorded · awaiting reply':'Confirmation not requested');if(j.stage==='Done')return money(Math.max(0,r.price-r.paid))+' still owed';if(j.stage==='Paid'){const ps=list('ledger').filter(p=>p.bookingId===r.id&&!p.voided_at);return ps.length?'Paid by '+[...new Set(ps.map(p=>p.method))].join(' / '):'Paid · method not recorded';}return workMeta(j).reason||'Reason not recorded';}
function workAction(j){return {'Quoted':['Nudge','workNudge'],'Booked':[j.booking?.type==='Van Hire'?'Collect / return van':'Equipment checklist','workBring'],'Done':['Request payment','workPayment'],'Paid':['Ask for a review','workReview'],'Lost / Cancelled':['Add / edit reason','workLost']}[j.stage];}
function workCard(j){const [label,action]=workAction(j),crew=workCrew(j);return '<article class="workCard '+(staleWork(j)?'workStale':'')+'" style="'+themeStyle(j.booking||j.quote)+'" draggable="'+(['Quoted','Booked','Done'].includes(j.stage))+'" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+j.id+'\')"><button class="workOpen" onclick="workDetail(\''+j.id+'\')">'+typeBadge(j.booking||j.quote)+'<strong>'+esc(j.name)+'</strong><span>'+esc(j.title)+'</span><b>'+money(j.amount)+'</b><small>'+esc(workStatusText(j))+'</small><span class="workPerson">'+(crew?'👤 '+esc(crew.mate):'Me')+'</span>'+(staleWork(j)?'<span class="workFlag amber">No answer for 3+ days</span>':'')+(overdueWork(j)?'<span class="workFlag">Did this happen?</span>':'')+'</button><button class="workNext '+(j.stage==='Done'?'gold':'')+'" onclick="'+action+'(\''+j.id+'\')">'+label+'</button></article>';}
function workColumns(){return workStages.map(s=>{const stat=workStats(s);return '<section class="workColumn" aria-label="'+s+'" ondragover="event.preventDefault()" ondrop="event.preventDefault();moveWork(event.dataTransfer.getData(\'text/plain\'),\''+s+'\')"><h2>'+s+' <span>'+stat.count+' · '+money(stat.total)+'</span></h2><div class="workCards">'+(workJobs().filter(j=>j.stage===s).map(workCard).join('')||'<p class="workEmpty">'+workEmpty(s)+'</p>')+'</div></section>';}).join('');}
function workList(){return workStages.filter(s=>jobFilter==='All'||jobFilter===s).map(s=>{const stat=workStats(s);return '<section class="workListStage"><h2>'+s+' · '+stat.count+' · '+money(stat.total)+'</h2>'+ (workJobs().filter(j=>j.stage===s).map(workCard).join('')||'<p>'+workEmpty(s)+'</p>')+'</section>';}).join('');}
function workContent(){return '<div class="workTop"><button class="quietAction" onclick="go(\'Inbox\')">'+inboxItems().length+' enquiries in Inbox →</button><div class="actions">'+['Board','List'].map(m=>'<button class="'+(jobsMode===m?'selected':'')+'" aria-pressed="'+(jobsMode===m)+'" onclick="jobsMode=\''+m+'\';render()">'+m+'</button>').join('')+'</div></div><div class="workFilters"><input aria-label="Search jobs" placeholder="Search customer or job…" value="'+esc(query)+'" oninput="query=this.value;refreshWork()"><select aria-label="Job type" onchange="jobsType=this.value;refreshWork()"><option value="All">All job types</option>'+[...new Map(unifiedJobs().filter(j=>j.stage!=='Enquiry').map(j=>{const t=jobTheme(j.booking||j.quote);return [t.name,t]})).values()].map(t=>'<option value="'+t.name+'" '+(jobsType===t.name?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select><select aria-label="Who is doing it" onchange="jobsWho=this.value;refreshWork()">'+['All','Me','Crew'].map(w=>'<option '+(jobsWho===w?'selected':'')+'>'+w+'</option>').join('')+'</select><label><input type="checkbox" '+(jobsVan?'checked':'')+' onchange="jobsVan=this.checked;refreshWork()"> Van jobs only</label></div>'+(jobsMode==='List'?'<div class="stageTabs workStageTabs" id="workStageTabs">'+workStageButtons()+'</div>':'<p class="workHint">Move cards forward to update a job. On your phone, swipe between stages.</p>')+'<div id="workSurface" class="'+(jobsMode==='Board'?'workBoard':'workList')+'">'+(jobsMode==='Board'?workColumns():workList())+'</div>';}
const workStageLook={All:{color:'#173453',bg:'#eaf0f8',icon:'▦'},Quoted:{color:'#7243a0',bg:'#f2eafb',icon:'▤'},Booked:{color:'#245fa9',bg:'#eaf2ff',icon:'▣'},Done:{color:'#865300',bg:'#fff2d7',icon:'✓'},Paid:{color:'#176346',bg:'#e5f5ed',icon:'£'},'Lost / Cancelled':{color:'#526176',bg:'#eef1f5',icon:'×'}};
function workStageButtons(){return ['All',...workStages].map(s=>{const stat=s==='All'?{count:workJobs().length,total:workJobs().reduce((n,j)=>n+Number(j.amount||0),0)}:workStats(s),look=workStageLook[s],active=jobFilter===s;return '<button class="workStageTab '+(active?'selected':'')+'" style="--stage-color:'+look.color+';--stage-bg:'+look.bg+'" aria-pressed="'+active+'" onclick="jobFilter=\''+s+'\';refreshWork()"><span class="workTabIcon" aria-hidden="true">'+look.icon+'</span><span class="workTabText"><strong>'+s+'</strong><span class="workTabNumbers"><b>'+stat.count+'</b> '+money(stat.total)+'</span></span><span class="workTabSelected" aria-hidden="true">'+(active?'✓':'')+'</span></button>';}).join('');}
function refreshWork(){el('workSurface').innerHTML=jobsMode==='Board'?workColumns():workList();if(jobsMode==='List')el('workStageTabs').innerHTML=workStageButtons();}

const renderBeforeBoard=render;render=function(){if(ready&&page==='Jobs'){shell('Jobs','',workContent(),'<button onclick="edit()">+ Add job</button>');navigation();return;}renderBeforeBoard();};
function workById(id){return unifiedJobs().find(j=>j.id===id);}
function workNudge(id){const j=workById(id);if(j.quote)followup(j.quote.id);else workDetail(id);}
function workBring(id){prepCard(workById(id).booking.id);}
function workPayment(id){paymentRequest(workById(id).booking.id);}
function workReview(id){const j=workById(id);show('<div class="dialoghead"><h2>Ask for a review</h2><button onclick="close()">×</button></div><form onsubmit="prepareWorkReview(event,\''+id+'\')">'+field('reviewUrl','Your Google review link (HTTPS)','', 'url','required')+'<p id="formerror" class="error"></p><button class="gold">Prepare message</button></form>');}
function prepareWorkReview(e,id){e.preventDefault();const url=new FormData(e.target).get('reviewUrl');if(!/^https:\/\//i.test(url)){el('formerror').textContent='Use an HTTPS review link.';return;}const j=workById(id);workMessage(j,'Thanks for choosing '+settings.business+', '+j.name+'. If you were happy with '+j.title+', please leave a review: '+url);}
function workMessage(j,text){show('<div class="dialoghead"><h2>Message draft</h2><button onclick="close()">×</button></div><textarea id="followText">'+esc(text)+'</textarea><p>Send this yourself. Nothing has been sent automatically.</p><div class="actions"><button onclick="copyDraft()">Copy message</button>'+((j.booking?.phone||j.quote?.phone)?'<a class="actionLink" target="_blank" rel="noopener" href="https://wa.me/'+String(j.booking?.phone||j.quote?.phone).replace(/\D/g,'').replace(/^0/,'44')+'?text='+encodeURIComponent(text)+'">WhatsApp</a>':'')+'</div>');}
function workLost(id){const j=workById(id);show('<div class="dialoghead"><h2>Lost / Cancelled</h2><button onclick="close()">×</button></div><p>'+esc(j.name)+' · '+esc(j.title)+'</p><div class="lossReasons">'+['Too expensive','Went elsewhere','No reply','I declined'].map(r=>'<button onclick="saveWorkLost(\''+id+'\',\''+r+'\')">'+r+'</button>').join('')+'</div><p id="formerror" class="error"></p>');}
async function saveWorkLost(id,reason){try{const j=workById(id),m=workMeta(j);await saveExtra('jobflow',{...m,reason,events:[...(m.events||[]),{at:new Date().toISOString(),text:'Lost / Cancelled: '+reason}]});if(j.booking)await persist({...j.booking,status:'Cancelled'});else await saveRecord('quote',{...j.quote,status:'Declined'});if(!demo)await refreshState();close();render();}catch(e){el('formerror').textContent=e.message;}}
function moveWork(id,target){const j=workById(id);if(!j)return;if(target==='Lost / Cancelled'){workLost(id);return;}if(workStages.indexOf(target)!==workStages.indexOf(j.stage)+1){toast('Move to the next stage. Open the job to reschedule or correct it.');return;}if(target==='Booked'){if(j.quote?.status!=='Accepted'){quoteEdit(j.quote.id);toast('Record customer acceptance first, then create the booking.');return;}if(j.booking)edit(j.booking.id);else quoteToBooking(j.quote.id);if(el('status'))el('status').value='Confirmed';}if(target==='Done')status(j.booking.id,'Completed');if(target==='Paid')paymentForm(j.booking.id);}
const todayBeforeBoard=todayView;todayView=function(){let html=todayBeforeBoard();const late=unifiedJobs().filter(overdueWork);const warning=late.map(j=>'<div class="warningRow"><span>'+esc(j.name)+' · Did this happen? · '+datetime(j.booking.start)+'</span><button onclick="outcomeReview(\''+j.booking.id+'\')">Update job</button></div>').join('');if(warning){if(html.includes('Actions requiring review</strong>'))html=html.replace('Actions requiring review</strong>','Actions requiring review</strong>'+warning);else html=html.replace('<div class="todayPriority">','<div class="warningStrip" role="alert"><strong>'+alarmIcon+'Check past jobs</strong>'+warning+'</div><div class="todayPriority">');}const stale=unifiedJobs().filter(staleWork);if(stale.length){const strip='<div class="workFollowups"><strong>Quotes waiting 3+ days</strong>'+stale.map(j=>'<div class="warningRow"><span>'+esc(j.name)+' · '+money(j.amount)+'</span><button onclick="workNudge(\''+j.id+'\')">Follow up</button></div>').join('')+'</div>';html=html.replace('<div class="todayPriority">',strip+'<div class="todayPriority">');}return html;};
function workDetail(id){const j=workById(id);if(!j)return;if(!j.booking){quoteEdit(j.quote.id);el('modal').insertAdjacentHTML('beforeend','<div class="actions"><button onclick="workLost(\''+id+'\')">Lost / Cancelled</button></div>');return;}detail(j.booking.id);}

function customerNextCheck(c){const p=c.profile;if(!p?.marketingConsent||p.blocked)return '';if(p.checkInDate&&(!p.lastCheckIn||p.lastCheckIn<p.checkInDate))return p.checkInDate;const last=[p.lastCheckIn,...c.done.map(r=>r.completedDate)].filter(Boolean).sort().at(-1);if(!last)return '';const d=new Date(last+'T12:00Z');d.setUTCMonth(d.getUTCMonth()+p.checkInMonths);return d.toISOString().slice(0,10);}

function customerPayDays(c){const vals=[];for(const r of c.done){if(!r.completedDate||r.paid<r.price||!r.price)continue;let sum=0,paidDate='';for(const p of c.payments.filter(p=>p.bookingId===r.id).sort((a,b)=>a.date.localeCompare(b.date))){sum+=p.amount;if(sum>=r.price-.005){paidDate=p.date;break;}}if(paidDate)vals.push(Math.max(0,Math.floor((Date.parse(paidDate+'T12:00Z')-Date.parse(r.completedDate+'T12:00Z'))/86400000)));}return vals.length?'Typically '+Math.round(vals.reduce((n,v)=>n+v,0)/vals.length)+' days after completion · '+vals.length+' jobs with payment dates':'Payment timing not recorded yet';}

async function createBusinessAccount(e){e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const f=Object.fromEntries(new FormData(e.target));await api('account','POST',{business:f.accountBusiness?.trim()||f.accountOwner,owner:f.accountOwner});const later=e.submitter?.name==='later';await load();if(ready){setupStep=0;if(later){await saveOnboardingPatch({onboarding:{...onboardingProgress(),updatedAt:new Date().toISOString()}});go('Today');toast('Workspace saved. You can finish setup later.');}else{await onboardingGo(0);toast('Workspace created. Start your setup.');}}}catch(err){el('accountError').textContent=err.message;button.disabled=false;}}
function businessAccountView(){return '<section class="panel setting accountOverview"><h2>'+esc(businessAccount?.name||settings.business)+'</h2><span class="tag statusGood">Business owner</span><dl><dt>Account email</dt><dd>'+esc(accountUser?.email||'')+'</dd><dt>Account holder</dt><dd>'+esc(settings.owner||businessAccount?.ownerName||'')+'</dd><dt>Sign-in</dt><dd>ChatGPT account</dd></dl><div class="actions"><button class="gold" onclick="go(\'Business Setup\')">Edit business details</button><a class="actionLink" target="_top" href="/signout-with-chatgpt?return_to=%2F">Sign out</a></div><p>Account recovery is handled through your ChatGPT sign-in.</p></section><section class="panel setting"><h2>Your business workspace</h2><p>Your customers, jobs, payments, crew and uploaded files belong to this business.</p><p>Team invitations and managing multiple businesses from one account are not available yet.</p></section>';}

const accountLoadBefore=load;load=async function(){try{const response=await fetch('/api/account',{headers:{Accept:'application/json'},cache:'no-store'}),session=await response.json();if(response.status===401){accountWelcome(null);return;}if(!response.ok)throw Error(session.error||'Unable to open your account.');if(!session.account){accountWelcome(session);return;}businessAccount=session.account;accountUser=session.user;settings={...settings,business:businessAccount.name,owner:businessAccount.ownerName};demo=false;await accountLoadBefore();}catch(err){el('main').innerHTML='<section class="panel setting"><h2>Unable to open your account</h2><p>'+esc(err.message)+'</p><button onclick="load()">Try again</button></section>';}};

const onboardingSteps=['Your details','What do you offer?','Services & prices','Your time','Your resources','Your first reply'];
let onboardingWrite=Promise.resolve();
function onboardingProgress(){return settings.onboarding||{version:1,step:0,completed:[],updatedAt:'',finishedAt:''};}
function saveOnboardingPatch(patch){const task=onboardingWrite.catch(()=>{}).then(async()=>{const next={...settings,...patch};if(!demo)await api('preferences','POST',next);settings=next;});onboardingWrite=task;return task;}
async function onboardingGo(step){try{await saveOnboardingPatch({onboarding:{...onboardingProgress(),step,updatedAt:new Date().toISOString()}});go('Business Setup');if(appIsPhone())el('main').scrollTop=0;}catch(e){toast(e.message);}}
async function onboardingDone(step,patch={},exit=false){const p=onboardingProgress(),completed=[...new Set([...p.completed,step])].sort(),finished=step===5&&completed.length===6,nextStep=finished?5:step===5?onboardingSteps.findIndex((_,i)=>!completed.includes(i)):Math.min(5,step+1);await saveOnboardingPatch({...patch,onboarding:{version:1,step:exit?step:nextStep,completed,updatedAt:new Date().toISOString(),finishedAt:finished?new Date().toISOString():''}});if(exit||finished){go('Today');toast(finished?'Setup complete. WhatsApp is not connected yet.':'Progress saved. Continue from Business Setup.');}else{render();if(appIsPhone())el('main').scrollTop=0;}}
function onboardingFooter(last=false){return '<p id="onboardingError" class="error" role="alert"></p><div class="actions onboardingActions"><button class="gold">'+(last?'Save & finish setup':'Save & continue')+'</button><button type="submit" name="exit" value="yes">Save & finish later</button></div>';}
function onboardingExit(e){return e.submitter?.name==='exit';}
function onboardingServiceRows(pricing=false){return list('services').map(s=>'<div class="setupServiceRow"><button type="button" class="onboardingService" onclick="serviceEdit('+esc(JSON.stringify(s.id))+')"><span><strong>'+esc(s.name)+'</strong><small>'+esc(s.model==='Quote required'?'Quote after discussing the job':s.model)+(s.model==='Quote required'?'': ' · '+money(s.rate))+'</small></span><b>'+(pricing?'Edit service & price':'Edit service')+'</b></button><button type="button" class="setupRemove" onclick="removeSetupService('+esc(JSON.stringify(s.id))+')">Remove</button></div>').join('');}
async function removeSetupService(id){try{await saveOnboardingPatch({removedServices:[...new Set([...(settings.removedServices||[]),id])]});render();toast('Service removed from your offered services.');}catch(e){toast(e.message);}}
const offeredServiceListBefore=list;list=function(kind){const values=offeredServiceListBefore(kind);return kind==='services'?values.filter(s=>!(settings.removedServices||[]).includes(s.id)):values;};
const setupSaveRecordBefore=saveRecord;saveRecord=async function(kind,r){if(demo&&kind==='service'){const arr=offeredServiceListBefore('services'),i=arr.findIndex(x=>x.id===r.id);if(i<0)arr.push(r);else arr[i]=r;return;}return setupSaveRecordBefore(kind,r);};

function onboardingAvailability(){let html=availabilityView().replace('onsubmit="saveCalendarAvailability(event)"','onsubmit="saveOnboardingAvailability(event)"').replace('<h3>My work pattern</h3>','<h3>Working hours</h3>').replace('<form onsubmit="saveOnboardingAvailability(event)">','<form onsubmit="saveOnboardingAvailability(event)"><label class="bringCheck"><input id="onboardingDayJob" name="dayJob" type="checkbox" '+(settings.shifts?.length?'checked':'')+' onchange="onboardingShiftFields()"> Block regular time when I’m unavailable</label><fieldset id="onboardingShiftFields" '+(settings.shifts?.length?'':'disabled hidden')+'><p>Select the days and times you’re unavailable.</p><button type="button" onclick="applyBlockedHours()">Suggest booking hours around this block</button>').replace('<div><label for="shiftBuffer">','</div></fieldset><div class="formgrid"><div><label for="shiftBuffer">').replace('<h3 style="margin-top:20px">When I take side jobs</h3>','<h3 style="margin-top:20px">When I take bookings</h3>').replace('<button class="gold">Save availability</button>','<button class="gold">Save & continue</button><button type="submit" name="exit" value="yes">Save & finish later</button>').replace('<button type="button" onclick="clearShifts()">Remove work shifts</button>','');
if(!settings.sideWindows){html=html.replace(/name="sideDay" value="6" checked/g,'name="sideDay" value="6"').replace(/name="sideStart([1-5])" value="16:30"/g,'name="sideStart$1" value="08:00"').replace(/name="sideEnd([1-5])" value="21:00"/g,'name="sideEnd$1" value="18:00"');}return html.replace(/Work starts/g,'Block starts').replace(/Work ends/g,'Block ends').replace(/Days off & van maintenance/g,'Days off & resource downtime');}
function onboardingShiftFields(){const on=el('onboardingDayJob').checked,fieldset=el('onboardingShiftFields');fieldset.hidden=!on;fieldset.disabled=!on;}
function applyBlockedHours(){const form=el('onboardingDayJob').form,f=new FormData(form),end=f.get('shiftEnd'),start=f.get('shiftStart'),buffer=Number(f.get('shiftBuffer')||0);if(!start||!end||start>=end){toast('For overnight or rotating blocks, adjust booking hours below for each day.');return;}const after=scheduleMinutes('2026-01-01T'+end,buffer).slice(11,16);for(const d of f.getAll('days')){const begin=form.elements['sideStart'+d],finish=form.elements['sideEnd'+d],check=[...form.querySelectorAll('input[name="sideDay"]')].find(n=>n.value===d);if(after<finish.value){begin.value=after;check.checked=true;}else{check.checked=false;}}toast('Booking hours suggested after the block. Review and save.');}
setupView=function(){const p=onboardingProgress(),step=p.step,progress=p.completed.length;let body='';
if(step===0)body='<form onsubmit="saveOnboardingBusiness(event)"><div class="formgrid">'+field('owner','Your name',settings.owner,'text','required maxlength="100" autocomplete="name"')+field('business','Business or trading name (optional)',settings.business===settings.owner?'':settings.business,'text','maxlength="100" autocomplete="organization"')+field('phone','Mobile number (optional)',settings.phone,'tel','maxlength="50" autocomplete="tel"')+field('area','Service areas / postcodes',settings.area,'text','required maxlength="300"')+'</div><p>Your contact number is optional here. Connecting WhatsApp is a separate step, where your messaging number will be verified.</p>'+onboardingFooter()+'</form>';
if(step===1)body='<form onsubmit="saveOnboardingTrades(event)"><p>Choose all the types of work you offer. You’ll select your services on the next page.</p><div class="onboardingTrades">'+Object.keys(tradeStarters).map(t=>'<label><input name="trades" type="checkbox" value="'+esc(t)+'" '+((settings.trades||[]).includes(t)?'checked':'')+'>'+t+'</label>').join('')+'</div><label for="customTrades">Other business types (optional, one per line)</label><textarea id="customTrades" name="customTrades" maxlength="1000" placeholder="e.g. Locksmith">'+esc((settings.customTrades||[]).join('\n'))+'</textarea>'+onboardingFooter()+'</form>';
if(step===2)body='<button type="button" class="setupBackServices" onclick="changeSetupServices()">Choose services</button><form onsubmit="saveOnboardingPricing(event)"><p>These are suggestions: edit or remove any service, or add your own. Set a fixed price, a rate, or choose “Quote after discussing the job”. Deposits are optional and can be agreed for each job.</p>'+field('defaultDeposit','Default deposit (%) · 0 means no deposit',settings.deposit||0,'number','min="0" max="100" required')+onboardingServiceRows(true)+'<button type="button" onclick="serviceEdit()">+ Add service or task</button>'+(list('services').length?'':'<p>Add at least one service first.</p>')+onboardingFooter()+'</form>';
if(step===2&&!settings.serviceSelectionDone)body=onboardingServiceSelection();
if(step===3)body=onboardingAvailability();
if(step===4)body='<form onsubmit="saveOnboardingResources(event)"><p>Your time is included. List equipment, vehicles or spaces you use, such as a ladder, pressure washer, trailer or workshop.</p><label for="otherResources">Other resources (one per line)</label><textarea id="otherResources" name="otherResources" maxlength="2000" placeholder="Pressure washer — model and notes\nTrailer — size and notes">'+esc(settings.resourceSetup?.otherResources||'')+'</textarea><p>This list records your kit. Individual equipment reservations are not enabled yet.</p><details class="setupVanDetails"><summary>Vehicle / van details and booking rules</summary><label class="bringCheck"><input name="vanEnabled" type="checkbox" '+(settings.resourceSetup?.vanEnabled||list('services').some(s=>(s.resources||'Owner')!=='Owner')?'checked':'')+'> I use a van for work or hire</label>'+field('vanName','Van label',settings.resourceSetup?.vanName||'My van','text','maxlength="100"')+'<h3>What each service needs</h3>'+list('services').map(s=>'<label>'+esc(s.name)+'<select name="resource_'+s.id+'">'+[['Owner','Me'],['Van','Van only'],['Owner + van','Me + van']].map(([v,l])=>'<option value="'+v+'" '+((s.resources||'Owner')===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label>').join('')+'<p>Jobdesk checks your time and van bookings together to prevent clashes.</p></details>'+onboardingFooter()+'</form>';
if(step===5)body='<form onsubmit="saveOnboardingReply(event)">'+selectField('tone','Message tone',['Friendly and professional','Short and direct','Formal'],settings.tone)+'<p>Choose a tone, then try a suggested reply or write your own. Changing tone keeps your edited message until you choose a suggestion.</p><div class="actions"><button type="button" onclick="suggestOnboardingReply(\'standard\')">Use suggested reply</button><button type="button" onclick="suggestOnboardingReply(\'busy\')">While I’m unavailable</button><button type="button" onclick="suggestOnboardingReply(\'photos\')">Ask for photos</button></div><label for="onboardingReply">First reply to a customer</label><textarea id="onboardingReply" name="autoReplyMessage" required maxlength="3000" oninput="previewOnboardingReply()">'+esc(settings.autoReplyMessage||'Hi, thanks for contacting '+settings.business+'. What work do you need, what is your postcode, and when would you like it done? Please send photos if they would help. I will review the details and get back to you.')+'</textarea><div class="onboardingReplyPreview"><span>Customer reply preview</span><div id="onboardingReplyBubble" class="chatBubble outgoing">'+esc(settings.autoReplyMessage||'Hi, thanks for contacting '+settings.business+'. What work do you need, what is your postcode, and when would you like it done? Please send photos if they would help. I will review the details and get back to you.')+'</div></div><p><strong>Not connected.</strong> This saves your reply; it does not send messages. Live WhatsApp is the next setup phase.</p>'+onboardingFooter(true)+'</form>';
return '<section class="onboardingHeader"><div><span>Step '+(step+1)+' of 6 · '+progress+' saved</span><h2>'+(step===2?(settings.serviceSelectionDone?'Your prices':'What services do you offer?'):onboardingSteps[step])+'</h2><progress max="6" value="'+(step+1)+'" aria-label="Setup progress"></progress></div><button onclick="go(\'Today\')">Return to Today</button></section><nav class="onboardingSteps" aria-label="Setup steps">'+onboardingSteps.map((name,i)=>'<button class="'+(i===step?'selected':'')+'" aria-current="'+(i===step?'step':'false')+'" onclick="onboardingGo('+i+')"><b>'+(p.completed.includes(i)?'✓':i+1)+'</b>'+name+'</button>').join('')+'</nav><p class="onboardingSaveHint">Use Save & continue or Save & finish later to keep your changes. You can return to any step.</p>'+(p.finishedAt?'<p class="onboardingComplete">✓ Setup complete · You can update your details here.</p>':'')+(step===3?body:'<section class="panel setting onboardingPanel">'+body+'</section>');};
function suggestOnboardingReply(kind){const tone=el('onboardingReply').form.elements.tone.value,name=settings.business||settings.owner;let text=tone==='Formal'?'Thank you for contacting '+name+'. Please provide details of the work, your postcode and preferred date.':tone==='Short and direct'?'Thanks for contacting '+name+'. What’s the job, postcode and preferred date?':'Hi, thanks for getting in touch with '+name+'! Tell me what you need, your postcode and when you’d like it done.';if(kind==='busy')text+=' I’m unavailable right now, but I’ll review your message when I’m back.';if(kind==='photos')text+=' Please send a couple of photos to help me assess the work.';el('onboardingReply').value=text;previewOnboardingReply();toast('Suggestion added. Edit it before saving.');}
function previewOnboardingReply(){el('onboardingReplyBubble').textContent=el('onboardingReply').value;}
async function onboardingSubmit(e,step,work){e.preventDefault();const buttons=e.target.querySelectorAll?.('button[type="submit"],button.gold')||[];buttons.forEach(b=>b.disabled=true);try{await work(new FormData(e.target));}catch(err){const error=el(step===3?'availabilityError':'onboardingError');if(error)error.textContent=err.message;else toast(err.message);}finally{buttons.forEach(b=>b.disabled=false);}}
function saveOnboardingBusiness(e){return onboardingSubmit(e,0,async f=>{const owner=f.get('owner').trim(),business=f.get('business').trim()||owner,phone=f.get('phone').trim(),area=f.get('area').trim();if(!owner||!area)throw Error('Enter your name and service area.');await onboardingDone(0,{business,owner,phone,area},onboardingExit(e));});}
function saveOnboardingTrades(e){return onboardingSubmit(e,1,async f=>{const trades=f.getAll('trades'),customTrades=(f.get('customTrades')||'').split('\n').map(t=>t.trim()).filter(Boolean);if(!trades.length&&!customTrades.length)throw Error('Choose a business type or add your own.');if(customTrades.length>20||customTrades.some(t=>t.length>100))throw Error('Use up to 20 trade names, each under 100 characters.');await onboardingDone(1,{trades,customTrades,serviceSelectionDone:false},onboardingExit(e));});}
function setupServiceCandidates(){const all=offeredServiceListBefore('services'),found=new Map();for(const s of all)found.set(s.name.toLowerCase(),{...s,existing:true});for(const trade of settings.trades||[])for(const name of tradeStarters[trade]||[]){if(!found.has(name.toLowerCase()))found.set(name.toLowerCase(),{id:'suggestion_'+found.size,name,trade,existing:false});}return [...found.values()];}
function onboardingServiceSelection(){return '<form onsubmit="saveSetupServiceSelection(event)"><p>Pick all the services you offer. Suggestions are optional. Your saved services are already selected; untick any you no longer offer.</p><div class="setupServiceChoices">'+setupServiceCandidates().map(s=>'<div><label><input type="checkbox" name="selectedServices" value="'+esc(s.id)+'" '+(s.existing&&!(settings.removedServices||[]).includes(s.id)?'checked':'')+'><span><strong>'+esc(s.name)+'</strong><small>'+esc(s.existing?'Saved service':s.trade+' suggestion')+'</small></span></label>'+(s.existing?'<button type="button" onclick="serviceEdit('+esc(JSON.stringify(s.id))+')">Edit / rename</button>':'')+'</div>').join('')+'</div><label for="customServices">Add your own services (one per line)</label><textarea id="customServices" name="customServices" maxlength="3000" placeholder="Curtain rail fitting\nGarden shed assembly"></textarea><p>You’ll set prices and deposits on the next page.</p><p id="onboardingError" class="error" role="alert"></p><div class="actions onboardingActions"><button class="gold">Save & set prices</button><button type="submit" name="exit" value="yes">Save & finish later</button></div></form>';}
async function changeSetupServices(){try{await saveOnboardingPatch({serviceSelectionDone:false});render();}catch(e){toast(e.message);}}
function saveSetupServiceSelection(e){return onboardingSubmit(e,2,async f=>{const selected=new Set(f.getAll('selectedServices')),candidates=setupServiceCandidates(),custom=(f.get('customServices')||'').split('\n').map(t=>t.trim()).filter(Boolean);if(!selected.size&&!custom.length)throw Error('Select a service or add your own.');if(custom.length>30||custom.some(t=>t.length>100))throw Error('Add up to 30 services, each under 100 characters.');const selectedExisting=candidates.filter(s=>s.existing&&selected.has(s.id));let removed=new Set(settings.removedServices||[]);for(const s of candidates.filter(s=>s.existing)){if(selected.has(s.id))removed.delete(s.id);else removed.add(s.id);}const additions=candidates.filter(s=>!s.existing&&selected.has(s.id)).concat(custom.map(name=>({name,trade:'Other trade'})));for(const s of additions){const existing=offeredServiceListBefore('services').find(x=>x.name.toLowerCase()===s.name.toLowerCase());if(existing){removed.delete(existing.id);continue;}await saveRecord('service',{id:crypto.randomUUID(),name:s.name,category:inclusiveCategory(s.trade),workKind:inclusiveKind(s.trade),defaultMinutes:0,model:'Quote required',rate:0,minimum:0,travel:0,deposit:0,resources:s.trade==='Van hire'?'Van':s.trade==='Removals'?'Owner + van':'Owner'});}await saveOnboardingPatch({removedServices:[...removed],serviceSelectionDone:true});if(onboardingExit(e)){go('Today');toast('Services saved. Set your prices when you return.');}else{render();el('main').scrollTop=0;}});}
function saveOnboardingPricing(e){return onboardingSubmit(e,2,async f=>{if(!list('services').length)throw Error('Add at least one service.');if(list('services').some(s=>s.model!=='Quote required'&&Number(s.rate)<=0))throw Error('Set a positive price or choose Quote required for each service.');const deposit=f.get('defaultDeposit')===null?settings.deposit:Number(f.get('defaultDeposit'));if(!Number.isFinite(deposit)||deposit<0||deposit>100)throw Error('Choose a deposit between 0 and 100%.');await onboardingDone(2,{deposit},onboardingExit(e));});}
function saveOnboardingAvailability(e){return onboardingSubmit(e,3,async f=>{if(!f.getAll('sideDay').length)throw Error('Choose at least one day for bookings.');if(f.has('dayJob')){el('availabilityError').textContent='';await saveCalendarAvailability(e);if(el('availabilityError')?.textContent)throw Error(el('availabilityError').textContent);if(!settings.availabilityReviewed)throw Error('Save your availability before continuing.');}else{const sideWindows=f.getAll('sideDay').map(d=>({days:[Number(d)],start:f.get('sideStart'+d),end:f.get('sideEnd'+d),minPrice:Number(f.get('sidePrice'+d))}));if(!sideWindows.length)throw Error('Choose at least one day for bookings.');await saveCalendarSettings({...settings,shifts:[],sideWindows,availabilityReviewed:true,shiftBuffer:0,travelBuffer:Number(f.get('travelBuffer')),maxEveningJobs:Number(f.get('maxEveningJobs')),handoverMinutes:Number(f.get('handoverMinutes'))});}await onboardingDone(3,{},onboardingExit(e));});}
function saveOnboardingResources(e){return onboardingSubmit(e,4,async f=>{const vanEnabled=f.has('vanEnabled'),vanName=(f.get('vanName')||'My van').trim()||'My van',updates=list('services').map(s=>({...s,resources:f.get('resource_'+s.id)||'Owner'}));if(!vanEnabled&&updates.some(s=>s.resources!=='Owner'))throw Error('Enable your van or change those services to Me.');for(const s of updates)await saveRecord('service',s);await onboardingDone(4,{resourceSetup:{vanEnabled,vanName,otherResources:(f.get('otherResources')||'').trim()}},onboardingExit(e));});}
function saveOnboardingReply(e){return onboardingSubmit(e,5,async f=>{const autoReplyMessage=f.get('autoReplyMessage').trim();if(!autoReplyMessage)throw Error('Enter your reply message.');await onboardingDone(5,{autoReplyMessage,tone:f.get('tone')},onboardingExit(e));});}
const onboardRenderBefore=render;render=function(){document.body?.classList?.toggle('setupMode',!ready||page==='Business Setup');if(ready&&page==='Business Setup'){shell('Business Setup','',setupView());navigation();return;}onboardRenderBefore();};
const onboardLoadBefore=load;load=async function(){await onboardLoadBefore();if(ready&&!demo&&businessAccount&&businessAccount.id!=='legacy'&&!onboardingProgress().finishedAt)go('Business Setup');};
const namedVanLaneBefore=calVanLane;calVanLane=function(ds){let html=namedVanLaneBefore(ds);if(settings.resourceSetup){if(!settings.resourceSetup.vanEnabled&&!calBookings().some(r=>resourceLabel(r)!=='Owner'))return '';html=html.replace('My van',esc(settings.resourceSetup.vanName||'My van'));}return html;};
const resumeOnboardingTodayBefore=todayView;todayView=function(){const p=settings.onboarding;return (p&&!p.finishedAt?'<button class="onboardingResume" onclick="go(\'Business Setup\')"><strong>Continue setup · '+p.completed.length+' of 6 saved</strong><span>'+onboardingSteps[p.step]+'</span></button>':'')+resumeOnboardingTodayBefore();};
const setupServiceEditorBefore=serviceEdit;serviceEdit=function(id){setupServiceEditorBefore(id);const modal=el('modal');const option=modal.querySelector?.('select[name="model"] option[value="Quote required"]');if(option)option.textContent='Quote after discussing the job';const form=modal.querySelector?.('form');form?.insertAdjacentHTML('beforeend','<p>Fixed price is agreed per task. Quote after discussing the job leaves the amount for you to agree with the customer. A service deposit of 0 uses your business default; set that default to 0 for no automatic deposit. Live deposit requests are not connected yet.</p>');};
function inclusiveCategory(trade){return ({'Van hire':'Van Hire',Gardener:'Gardening',Cleaner:'Cleaning',Hairdresser:'Beauty',Barber:'Beauty','Beauty & nails':'Beauty',Baker:'Food',Tutor:'Education','Fitness coach':'Fitness','Pet care':'Pet care','Creative services':'Creative'})[trade]||'Maintenance';}
function inclusiveKind(trade){return trade==='Baker'?'Order':['Hairdresser','Barber','Beauty & nails','Tutor','Fitness coach','Pet care'].includes(trade)?'Appointment':'Job';}
function serviceWorkKind(r){return list('services').find(s=>s.id===(r?.serviceId||r?.service_id))?.workKind||'Job';}
const inclusiveEditorBefore=serviceEdit;serviceEdit=function(id){inclusiveEditorBefore(id);const s=list('services').find(s=>s.id===id)||{},form=el('modal').querySelector?.('form');form?.insertAdjacentHTML('afterbegin','<section class="serviceDetails"><h3>How this service works</h3>'+selectField('workKind','Work type',['Job','Appointment','Order'],s.workKind||'Job')+field('defaultMinutes','Typical working time (minutes) · 0 means set per booking',s.defaultMinutes||0,'number','min="0" max="10080" required')+selectField('depositPolicy','Deposit rule',['Default','None','Service percentage'],s.depositPolicy||'Default')+'<p>Appointments reserve their duration. For orders, book the preparation time in the calendar and record the collection or delivery deadline separately.</p></section>');};
const inclusiveSaveServiceBefore=saveService;saveService=async function(e,id){const input=e.target.querySelector?.('[name="depositPolicy"]');if(input?.value==='None'){const dep=e.target.querySelector('[name="deposit"]');if(dep)dep.value=0;}await inclusiveSaveServiceBefore(e,id);};
const inclusiveNavigationBefore=navigation;navigation=function(){inclusiveNavigationBefore();for(const root of [el('nav'),el('phoneNav')]){if(!root)continue;root.innerHTML=root.innerHTML.replace(/<span class="navLabel">Jobs<\/span>/g,'<span class="navLabel">Work</span>').replace(/<span class="bottomLabel">Jobs<\/span>/g,'<span class="bottomLabel">Work</span>').replace(/aria-label="Jobs"/g,'aria-label="Work"');}if(page==='Jobs')el('crumb').textContent='Work';};
const inclusiveShellBefore=shell;shell=function(title,description,...rest){if(title==='Jobs')title='Work';inclusiveShellBefore(title,description,...rest);};
const inclusiveFillBefore=fillService;fillService=function(id){inclusiveFillBefore(id);const s=list('services').find(s=>s.id===id);if(s?.defaultMinutes&&el('start')?.value&&el('end'))el('end').value=scheduleMinutes(el('start').value,s.defaultMinutes);};
const inclusiveNextBefore=nextCard;nextCard=function(r){let html=inclusiveNextBefore(r);if(!r)return html;const kind=serviceWorkKind(r);if(kind==='Appointment')html=html.replace(/Arrived on site/g,'Start appointment').replace(/Bring<\/h3>/g,'Prepare</h3>');if(kind==='Order')html=html.replace(/Arrived on site/g,'Start preparation').replace(/Next appointment/g,'Next order');return html;};
function orderDetails(id){const r=find(id),m=extras('jobmeta').find(x=>x.bookingId===id)||{};if(!r)return;show('<div class="dialoghead"><h2>Order details</h2><button onclick="close()">×</button></div><form onsubmit="saveOrderDetails(event,'+esc(JSON.stringify(id))+')">'+field('deadline','Collection / delivery deadline',m.deadline||'','datetime-local','required')+selectField('fulfilment','How the customer receives it',['Collection','Delivery'],m.fulfilment||'Collection')+field('orderQuantity','Quantity',m.orderQuantity||r.quantity||1,'number','min="1" max="100000" required')+'<label for="orderNotes">Order requirements</label><textarea id="orderNotes" name="orderNotes" maxlength="2000">'+esc(m.orderNotes||'')+'</textarea><p>The booked start and end times reserve preparation time. Make sure preparation finishes before this deadline. Delivery travel needs its own diary block.</p><p id="formerror" class="error"></p><button class="gold">Save order details</button></form>');}
async function saveOrderDetails(e,id){e.preventDefault();try{const r=find(id),f=Object.fromEntries(new FormData(e.target));if(f.deadline<r.end)throw Error('The deadline must be after the booked preparation finishes.');const old=extras('jobmeta').find(m=>m.bookingId===id)||{};await saveExtra('jobmeta',{...old,id:'meta_'+id,bookingId:id,actualHours:old.actualHours||0,source:old.source||'Manual / unknown',deadline:f.deadline,fulfilment:f.fulfilment,orderQuantity:Number(f.orderQuantity),orderNotes:f.orderNotes});close();render();toast('Order details saved.');}catch(e){el('formerror').textContent=e.message;}}
const inclusiveDetailBefore=detail;detail=function(id){inclusiveDetailBefore(id);const r=find(id);if(serviceWorkKind(r)==='Order')el('modal').insertAdjacentHTML('beforeend','<section class="serviceDetails"><h3>Order preparation & fulfilment</h3><p>Booked preparation: '+esc(datetime(r.start))+' to '+esc(datetime(r.end))+'</p><button onclick="orderDetails('+esc(JSON.stringify(id))+')">Collection / delivery details</button></section>');};
